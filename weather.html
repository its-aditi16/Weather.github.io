<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather webpage</title>
    <style>
    *{
        padding: 0;
        margin: 0;
        font-family: 'Poppins',sans-serif;
        box-sizing: border-box;
    }
    
    body{
        background-image: url(bgin.jpg);
        background-size: cover;
    }
    
    .card{
        width: 90%;
        max-width: 470px;
        color: #fff;
        margin: 100px auto 0;
        border-radius: 20px;
        padding: 40px 35px;
        text-align: center;
        background: rgba(255, 255, 255, 0.1); 
        backdrop-filter: blur(10px); 
        -webkit-backdrop-filter: blur(10px); 
        border: 1px solid rgba(255, 255, 255, 0.2); 
    }
    
    .search{
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .search input{
        border: 0;
        outline: 0;
        color: #000;
        background: #ebfffc;
        padding: 10px 25px;
        height: 60px;
        border-radius: 30px;
        flex: 1;
        margin-right: 16px;
        font-size: 18px;
    }
    
    .search button{
        border: 0;
        outline: 0;
        background: #ebfffc;
        border-radius: 50%;
        height: 60px;
        width: 60px;
        cursor: pointer;
    }
    
    .search img{
        width: 16px;
    }
    
    .icon{
        width: 170px;
        margin-top: 30px;
    }
    
    .weather h1{
        font-size: 80px;
        font-weight: 500;
    }
    
    .weather h2{
        font-size: 45px;
        font-weight: 400;
        margin-top: -10px;
    }
    
    .details{
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        margin-top: 50px;
    }
    
    .col{
        display: flex;
        align-items: center;
        text-align: left;
    }
    
    .col img{
        width: 40px;
        margin-right: 10px;
    }
    
    .humidity, .wind{
        font-size: 28px;
        margin-top: -6px;
    }
    
    .weather{
        display: none;
    }
    
    .error{
        text-align: left;
        margin-left: 10px;
        font-size: 14px;
        margin-top: 10px;
        display: none;
    }
    </style>
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name">
            <button><img src="search.png"></button>
            <button onclick="window.location.href='welcome.html'">Home</button>
        </div>
        <div class="error">
            <p>Invalid city name</p>
        </div>
        <div class="weather">
            <img src="rain.png" class="icon">
            <h1 class="temp">30°C</h1>
            <h2 class="city">Banglore</h2>
            <div class="details">
                <div class="col">
                    <img src="humidity.png">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="wind.png">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const apiKey = 'f00c38e0279b7bc85480c3fe775d518c';
const apiUrl = 'https://api.openweathermap.org/data/2.5/weather?units=metric&q=';

const searchBox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");
const weatherIcon = document.querySelector(".icon")
async function checkWeather(city) {
    const response = await fetch(apiUrl + city + `&appid=${apiKey}`);

    if (response.status == 404) {
        document.querySelector(".error").style.display = "block";
        document.querySelector(".weather").style.display = "none";
    } else {
        const data = await response.json();

        document.querySelector(".city").innerHTML = data.name;
        document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°C";
        document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
        document.querySelector(".wind").innerHTML = data.wind.speed + "km/h";

        const weatherCondition = data.weather[0].main;
        const temperature = data.main.temp; 

        
        if (temperature <= 0) {
            weatherIcon.src = "snow.png"; 
        } else if (weatherCondition == "Clouds") {
            weatherIcon.src = "cloud.png";
        } else if (weatherCondition == "Clear") {
            weatherIcon.src = "clear.png";
        } else if (weatherCondition == "Rain") {
            weatherIcon.src = "heavy rain.png";
        } else if (weatherCondition == "Drizzle") {
            weatherIcon.src = "drizzle.png";
        } else if (weatherCondition == "Mist") {
            weatherIcon.src = "mist.png";
        } else {
            weatherIcon.src = "default.png"; 
        }

        document.querySelector(".weather").style.display = "block";
        document.querySelector(".error").style.display = "none";
    }
}


searchBtn.addEventListener("click", () =>{
    checkWeather(searchBox.value);
})
      </script>
</body>
</html>
