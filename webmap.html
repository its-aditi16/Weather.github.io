<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        #map {
            height: 90vh;
            width: 100%;
            margin: 10px auto;
        }

        .info {
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 8px;
            margin: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin: 15px;
        }
        button{
            background-color: rgb(42, 145, 165);
        }
    </style>
</head>
<body>
    <h1>Weather Map</h1>
    <button onclick="window.location.href='welcome.html'">Home</button>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // OpenWeatherMap API key
        const apiKey = "f00c38e0279b7bc85480c3fe775d518c";
        const map = L.map('map').setView([20, 0], 2); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Fetch weather data and add markers
        async function getWeather(lat, lon) {
            const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${apiKey}`);
            const data = await response.json();
            return {
                temp: data.main.temp,
                humidity: data.main.humidity,
                wind: data.wind.speed,
                weather: data.weather[0].description,
            };
        }
        function addMarker(lat, lon) {
            getWeather(lat, lon).then((weather) => {
                const marker = L.marker([lat, lon]).addTo(map);
                marker.bindPopup(`
                    <b>Temperature:</b> ${weather.temp}°C<br>
                    <b>Humidity:</b> ${weather.humidity}%<br>
                    <b>Wind:</b> ${weather.wind} km/h<br>
                    <b>Weather:</b> ${weather.weather}<br>
                `).openPopup();
            });
        }
        const cities = [
            { name: "New York", lat: 40.7128, lon: -74.0060 },
            { name: "London", lat: 51.5074, lon: -0.1278 },
            { name: "Sydney", lat: -33.8688, lon: 151.2093 },
            { name: "Tokyo", lat: 35.6895, lon: 139.6917 },
        ];

        cities.forEach(city => addMarker(city.lat, city.lon));
        map.on('click', async function (e) {
            const { lat, lng } = e.latlng;
            addMarker(lat, lng);
        });
    </script>
</body>
</html>
